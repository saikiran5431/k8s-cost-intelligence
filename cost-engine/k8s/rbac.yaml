# cost-engine/k8s/rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cost-exporter
  namespace: cost-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cost-exporter-role
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cost-exporter-binding
subjects:
  - kind: ServiceAccount
    name: cost-exporter
    namespace: cost-system
roleRef:
  kind: ClusterRole
  name: cost-exporter-role
  apiGroup: rbac.authorization.k8s.io
