server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        proxy_pass http://recommendations-engine.cost-system.svc.cluster.local:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # New: proxy to the load-generator service so the browser can call
    # /load-api/load/start etc. without needing its own port-forward.
    location /load-api/ {
        proxy_pass http://load-generator.cost-system.svc.cluster.local:8070/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Load job requests can run up to MAX_DURATION_SECONDS (300s) on
        # the backend; keep the proxy read timeout generous enough that
        # nginx doesn't cut the connection on /load/start before the
        # initial response (job kickoff) comes back. The actual load job
        # itself runs as a background asyncio task, so the HTTP response
        # to /load/start returns almost immediately regardless.
        proxy_read_timeout 30s;
    }
}
