# web-ui/k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  namespace: cost-system
  labels:
    app: web-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-ui
  template:
    metadata:
      labels:
        app: web-ui
    spec:
      containers:
        - name: web-ui
          image: web-ui:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: web-ui
  namespace: cost-system
  labels:
    app: web-ui
spec:
  selector:
    app: web-ui
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: NodePort