# recommendations-engine/k8s/rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recommendations-engine
  namespace: cost-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: recommendations-engine-role
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: recommendations-engine-binding
subjects:
  - kind: ServiceAccount
    name: recommendations-engine
    namespace: cost-system
roleRef:
  kind: ClusterRole
  name: recommendations-engine-role
  apiGroup: rbac.authorization.k8s.io
