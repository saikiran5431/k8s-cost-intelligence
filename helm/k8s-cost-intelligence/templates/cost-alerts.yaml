{{- $_ := .Values.cloudProvider }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cost-intelligence-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: cost.waste
      interval: 60s
      rules:
        - alert: HighNamespaceWaste
          expr: k8s_namespace_waste_hourly_cost_dollars > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High waste detected"
            description: "Namespace is wasting resources"
        - alert: CriticalNamespaceWaste
          expr: k8s_namespace_waste_hourly_cost_dollars > 0.10
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Critical waste detected"
            description: "Namespace is wasting critical amount of resources"
        - alert: LowNamespaceEfficiency
          expr: k8s_namespace_efficiency_percent < 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Low efficiency detected"
            description: "Namespace efficiency is critically low"
    - name: cost.recording
      interval: 60s
      rules:
        - record: cluster:hourly_cost:sum
          expr: sum(k8s_namespace_hourly_cost_dollars)
        - record: cluster:waste_hourly:sum
          expr: sum(k8s_namespace_waste_hourly_cost_dollars)
        - record: cluster:efficiency:avg
          expr: avg(k8s_namespace_efficiency_percent)
