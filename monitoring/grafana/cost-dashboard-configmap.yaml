apiVersion: v1
data:
  cost-intelligence.json: "{\n  \"__inputs\": [],\n  \"__requires\": [],\n  \"annotations\":
    {\n    \"list\": []\n  },\n  \"description\": \"K8s Cost Intelligence — namespace
    cost, waste, and efficiency\",\n  \"editable\": true,\n  \"fiscalYearStartMonth\":
    0,\n  \"graphTooltip\": 1,\n  \"id\": null,\n  \"links\": [],\n  \"panels\": [\n
    \   {\n      \"id\": 1,\n      \"title\": \"\U0001F4B0 Hourly Cost by Namespace
    (USD)\",\n      \"type\": \"bargauge\",\n      \"gridPos\": { \"h\": 8, \"w\":
    12, \"x\": 0, \"y\": 0 },\n      \"options\": {\n        \"reduceOptions\": {\n
    \         \"calcs\": [\"lastNotNull\"],\n          \"fields\": \"\",\n          \"values\":
    false\n        },\n        \"orientation\": \"horizontal\",\n        \"displayMode\":
    \"gradient\",\n        \"valueMode\": \"color\",\n        \"showUnfilled\": true,\n
    \       \"minVizWidth\": 0,\n        \"minVizHeight\": 10\n      },\n      \"fieldConfig\":
    {\n        \"defaults\": {\n          \"unit\": \"currencyUSD\",\n          \"decimals\":
    4,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\":
    [\n              { \"color\": \"green\", \"value\": null },\n              { \"color\":
    \"yellow\", \"value\": 0.01 },\n              { \"color\": \"red\", \"value\":
    0.05 }\n            ]\n          },\n          \"color\": { \"mode\": \"thresholds\"
    }\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n
    \         \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\"
    },\n          \"expr\": \"k8s_namespace_hourly_cost_dollars\",\n          \"legendFormat\":
    \"{{namespace}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"datasource\":
    { \"type\": \"prometheus\", \"uid\": \"prometheus\" }\n    },\n    {\n      \"id\":
    2,\n      \"title\": \"\U0001F4C5 Monthly Cost Projection by Namespace (USD)\",\n
    \     \"type\": \"bargauge\",\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\":
    12, \"y\": 0 },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\":
    [\"lastNotNull\"],\n          \"fields\": \"\",\n          \"values\": false\n
    \       },\n        \"orientation\": \"horizontal\",\n        \"displayMode\":
    \"gradient\",\n        \"showUnfilled\": true\n      },\n      \"fieldConfig\":
    {\n        \"defaults\": {\n          \"unit\": \"currencyUSD\",\n          \"decimals\":
    2,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\":
    [\n              { \"color\": \"green\", \"value\": null },\n              { \"color\":
    \"yellow\", \"value\": 5 },\n              { \"color\": \"red\", \"value\": 20
    }\n            ]\n          },\n          \"color\": { \"mode\": \"thresholds\"
    }\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n
    \         \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\"
    },\n          \"expr\": \"k8s_namespace_monthly_cost_dollars\",\n          \"legendFormat\":
    \"{{namespace}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"datasource\":
    { \"type\": \"prometheus\", \"uid\": \"prometheus\" }\n    },\n    {\n      \"id\":
    3,\n      \"title\": \"\U0001F5D1️ Waste Cost by Namespace (USD/hr) — Money Being
    Thrown Away\",\n      \"type\": \"bargauge\",\n      \"gridPos\": { \"h\": 8,
    \"w\": 12, \"x\": 0, \"y\": 8 },\n      \"options\": {\n        \"reduceOptions\":
    {\n          \"calcs\": [\"lastNotNull\"],\n          \"fields\": \"\",\n          \"values\":
    false\n        },\n        \"orientation\": \"horizontal\",\n        \"displayMode\":
    \"gradient\",\n        \"showUnfilled\": true\n      },\n      \"fieldConfig\":
    {\n        \"defaults\": {\n          \"unit\": \"currencyUSD\",\n          \"decimals\":
    4,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\":
    [\n              { \"color\": \"green\", \"value\": null },\n              { \"color\":
    \"yellow\", \"value\": 0.01 },\n              { \"color\": \"red\", \"value\":
    0.05 }\n            ]\n          },\n          \"color\": { \"mode\": \"thresholds\"
    }\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n
    \         \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\"
    },\n          \"expr\": \"k8s_namespace_waste_hourly_cost_dollars\",\n          \"legendFormat\":
    \"{{namespace}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"datasource\":
    { \"type\": \"prometheus\", \"uid\": \"prometheus\" }\n    },\n    {\n      \"id\":
    4,\n      \"title\": \"⚡ Resource Efficiency % by Namespace\",\n      \"type\":
    \"gauge\",\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 12, \"y\": 8 },\n
    \     \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\"lastNotNull\"],\n
    \         \"fields\": \"\",\n          \"values\": false\n        },\n        \"orientation\":
    \"auto\",\n        \"showThresholdLabels\": false,\n        \"showThresholdMarkers\":
    true\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\":
    \"percent\",\n          \"decimals\": 1,\n          \"min\": 0,\n          \"max\":
    100,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\":
    [\n              { \"color\": \"red\", \"value\": null },\n              { \"color\":
    \"yellow\", \"value\": 40 },\n              { \"color\": \"green\", \"value\":
    70 }\n            ]\n          },\n          \"color\": { \"mode\": \"thresholds\"
    }\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n
    \         \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\"
    },\n          \"expr\": \"k8s_namespace_efficiency_percent\",\n          \"legendFormat\":
    \"{{namespace}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"datasource\":
    { \"type\": \"prometheus\", \"uid\": \"prometheus\" }\n    },\n    {\n      \"id\":
    5,\n      \"title\": \"\U0001F4C8 Hourly Cost Over Time — All Namespaces\",\n
    \     \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 24, \"x\":
