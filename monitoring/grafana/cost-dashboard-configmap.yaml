    \"sort\": \"desc\" },\n        \"legend\": {\n          \"displayMode\": \"table\",\n
    \         \"placement\": \"bottom\",\n          \"calcs\": [\"lastNotNull\", \"max\",
    \"mean\"]\n        }\n      },\n      \"fieldConfig\": {\n        \"defaults\":
    {\n          \"unit\": \"currencyUSD\",\n          \"decimals\": 4,\n          \"custom\":
    {\n            \"lineWidth\": 2,\n            \"fillOpacity\": 10,\n            \"gradientMode\":
    \"opacity\",\n            \"spanNulls\": false\n          },\n          \"color\":
    { \"mode\": \"palette-classic\" }\n        },\n        \"overrides\": []\n      },\n
    \     \"targets\": [\n        {\n          \"datasource\": { \"type\": \"prometheus\",
    \"uid\": \"prometheus\" },\n          \"expr\": \"k8s_namespace_hourly_cost_dollars\",\n
    \         \"legendFormat\": \"Cost: {{namespace}}\",\n          \"refId\": \"A\"\n
    \       },\n        {\n          \"datasource\": { \"type\": \"prometheus\", \"uid\":
    \"prometheus\" },\n          \"expr\": \"k8s_namespace_waste_hourly_cost_dollars\",\n
    \         \"legendFormat\": \"Waste: {{namespace}}\",\n          \"refId\": \"B\"\n
    \       }\n      ],\n      \"datasource\": { \"type\": \"prometheus\", \"uid\":
    \"prometheus\" }\n    },\n    {\n      \"id\": 6,\n      \"title\": \"\U0001F4CA
    Cost Summary Table\",\n      \"type\": \"table\",\n      \"gridPos\": { \"h\":
    8, \"w\": 24, \"x\": 0, \"y\": 24 },\n      \"options\": {\n        \"showHeader\":
    true,\n        \"sortBy\": [{ \"displayName\": \"Waste ($/hr)\", \"desc\": true
    }]\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"custom\":
    {\n            \"align\": \"auto\",\n            \"displayMode\": \"auto\"\n          }\n
    \       },\n        \"overrides\": [\n          {\n            \"matcher\": {
    \"id\": \"byName\", \"options\": \"Hourly Cost\" },\n            \"properties\":
    [\n              { \"id\": \"unit\", \"value\": \"currencyUSD\" },\n              {
    \"id\": \"decimals\", \"value\": 4 },\n              { \"id\": \"custom.displayMode\",
    \"value\": \"color-background\" }\n            ]\n          },\n          {\n
    \           \"matcher\": { \"id\": \"byName\", \"options\": \"Monthly Cost\" },\n
    \           \"properties\": [\n              { \"id\": \"unit\", \"value\": \"currencyUSD\"
    },\n              { \"id\": \"decimals\", \"value\": 2 },\n              { \"id\":
    \"custom.displayMode\", \"value\": \"color-background\" }\n            ]\n          },\n
    \         {\n            \"matcher\": { \"id\": \"byName\", \"options\": \"Waste
    ($/hr)\" },\n            \"properties\": [\n              { \"id\": \"unit\",
    \"value\": \"currencyUSD\" },\n              { \"id\": \"decimals\", \"value\":
    4 },\n              { \"id\": \"custom.displayMode\", \"value\": \"color-background\"
    },\n              {\n                \"id\": \"thresholds\",\n                \"value\":
    {\n                  \"mode\": \"absolute\",\n                  \"steps\": [\n
    \                   { \"color\": \"green\", \"value\": null },\n                    {
    \"color\": \"yellow\", \"value\": 0.01 },\n                    { \"color\": \"red\",
    \"value\": 0.05 }\n                  ]\n                }\n              }\n            ]\n
    \         },\n          {\n            \"matcher\": { \"id\": \"byName\", \"options\":
    \"Efficiency %\" },\n            \"properties\": [\n              { \"id\": \"unit\",
    \"value\": \"percent\" },\n              { \"id\": \"decimals\", \"value\": 1
    },\n              { \"id\": \"custom.displayMode\", \"value\": \"color-background\"
    },\n              {\n                \"id\": \"thresholds\",\n                \"value\":
    {\n                  \"mode\": \"absolute\",\n                  \"steps\": [\n
    \                   { \"color\": \"red\", \"value\": null },\n                    {
    \"color\": \"yellow\", \"value\": 40 },\n                    { \"color\": \"green\",
    \"value\": 70 }\n                  ]\n                }\n              }\n            ]\n
    \         }\n        ]\n      },\n      \"targets\": [\n        {\n          \"datasource\":
    { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n          \"expr\": \"k8s_namespace_hourly_cost_dollars\",\n
    \         \"legendFormat\": \"{{namespace}}\",\n          \"refId\": \"A\",\n
    \         \"instant\": true\n        },\n        {\n          \"datasource\":
    { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n          \"expr\": \"k8s_namespace_monthly_cost_dollars\",\n
    \         \"legendFormat\": \"{{namespace}}\",\n          \"refId\": \"B\",\n
    \         \"instant\": true\n        },\n        {\n          \"datasource\":
    { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n          \"expr\": \"k8s_namespace_waste_hourly_cost_dollars\",\n
    \         \"legendFormat\": \"{{namespace}}\",\n          \"refId\": \"C\",\n
    \         \"instant\": true\n        },\n        {\n          \"datasource\":
    { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n          \"expr\": \"k8s_namespace_efficiency_percent\",\n
    \         \"legendFormat\": \"{{namespace}}\",\n          \"refId\": \"D\",\n
    \         \"instant\": true\n        }\n      ],\n      \"transformations\": [\n
    \       {\n          \"id\": \"merge\",\n          \"options\": {}\n        },\n
    \       {\n          \"id\": \"organize\",\n          \"options\": {\n            \"renameByName\":
    {\n              \"Value #A\": \"Hourly Cost\",\n              \"Value #B\": \"Monthly
    Cost\",\n              \"Value #C\": \"Waste ($/hr)\",\n              \"Value
    #D\": \"Efficiency %\"\n            }\n          }\n        }\n      ],\n      \"datasource\":
    { \"type\": \"prometheus\", \"uid\": \"prometheus\" }\n    }\n  ],\n  \"refresh\":
    \"30s\",\n  \"schemaVersion\": 38,\n  \"tags\": [\"kubernetes\", \"cost\", \"efficiency\"],\n
    \ \"templating\": { \"list\": [] },\n  \"time\": { \"from\": \"now-1h\", \"to\":
    \"now\" },\n  \"timepicker\": {},\n  \"timezone\": \"browser\",\n  \"title\":
    \"K8s Cost Intelligence\",\n  \"uid\": \"k8s-cost-intelligence\",\n  \"version\":
    1\n}"
